<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sargodha Random Chat</title>
<style>body{margin:0;font-family:sans-serif;background:#0f0f0f;color:#fff;height:100vh;display:flex;flex-direction:column}header{background:#111;padding:12px;display:flex;justify-content:space-between;border-bottom:2px solid #ff6600}#chat{flex:1;overflow:auto;padding:15px;display:flex;flex-direction:column;gap:8px}.msg{padding:10px 14px;border-radius:18px;max-width:75%}.you{background:#ff6600;align-self:flex-end}.stranger{background:#222;align-self:flex-start}.system{color:#888;text-align:center;font-size:13px}#controls{background:#1a1a1a;padding:10px;display:flex;gap:8px}input{flex:1;padding:13px;border-radius:25px;border:none;background:#2a2a2a;color:#fff}.btn{border:none;border-radius:25px;padding:12px 16px;font-weight:bold;cursor:pointer}.send{background:#ff6600;color:#fff}.next{background:#333;color:#fff}.report{background:#ff1a1a;color:#fff}</style>
</head>
<body>
<header><span><b style="color:#ff6600">SARGODHA</b> CHAT</span><span id="status">● Connecting...</span></header>
<div id="chat"></div>
<div id="controls">
<button class="btn report" onclick="report()">🚩 Report</button>
<button class="btn next" onclick="nextChat()">Next</button>
<input id="inp" placeholder="Type..."><button class="btn send" onclick="send()">Send</button>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const chat = document.getElementById('chat');
const inp = document.getElementById('inp');
function add(text,cls){let d=document.createElement('div');d.className='msg '+cls;d.innerText=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
socket.on('waiting',m=>{chat.innerHTML='';add(m,'system');document.getElementById('status').innerText=m});
socket.on('connected',m=>{chat.innerHTML='';add(m,'system');document.getElementById('status').innerText='● Connected'});
socket.on('message',m=>add(m,'stranger'));
socket.on('stranger_left',()=>{add('Stranger disconnected. Click Next for new chat','system')});
socket.on('reported',()=>add('You have been reported! Be respectful','system'));
socket.on('banned',()=>{add('You are banned for 3 reports','system');});
function send(){if(!inp.value.trim())return;add(inp.value,'you');socket.emit('message',inp.value);inp.value=''}
function nextChat(){socket.emit('next');chat.innerHTML='';add('Finding new stranger...','system')}
function report(){if(confirm('Report this user for abuse?')){socket.emit('report');alert('Reported!');nextChat()}}
inp.addEventListener('keypress',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
